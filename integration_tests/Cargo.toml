[package]
name = "integration-tests"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "integration-tests"
path = "src/main.rs"

[[bin]]
name = "lora-tests"
path = "src/lora_tests.rs"

[[bin]]
name = "duty-cycle-tests"
path = "src/duty_cycle_tests.rs"

[[bin]]
name = "hub-tests"
path = "src/hub_tests.rs"

[[bin]]
name = "gateway-udp-tests"
path = "src/gateway_udp_tests.rs"

[[bin]]
name = "ble-e2e-tests"
path = "src/ble_e2e_tests.rs"

[[bin]]
name = "hub-status"
path = "src/hub_status.rs"

[dependencies]
# Serial port communication (usbportinfo-interface exposes the USB interface
# number so we can tell the data CDC from the debug CDC deterministically)
serialport = { version = "4.9", features = ["usbportinfo-interface"] }

# COBS encoding (same as firmware)
corncobs = "0.1"

# CRC calculation (same as firmware)
crc = "3.4"

# CLI argument parsing
clap = { version = "4.6", features = ["derive", "env"] }

# Error handling
anyhow = "1.0"

# Coloured output
colored = "3.1"

# MQTT broker client for the hub bridge-mode test
rumqttc = "0.25"

# BLE communication with the node device (ble-e2e-tests)
btleplug = "0.12"
uuid = "1.24"
tokio = { version = "1.53", features = ["rt-multi-thread", "time", "macros"] }
futures = "0.3"
