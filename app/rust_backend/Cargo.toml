[package]
name = "rust_backend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Pinned exactly to the flutter_rust_bridge Dart dependency and the codegen
# binary; the three versions must match or RustLib.init throws.
flutter_rust_bridge = "=2.12.0"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain-HTTP client for the hub's provisioning API (192.168.4.1, no TLS).
ureq = { version = "3", default-features = false, features = ["json"] }
# Field caps shared with the firmware's provisioning protocol.
hub-protocol = { path = "../../hub-protocol" }

[dev-dependencies]
mockall = "0.15"

[package.metadata.cargo-check-cfg]
rustc-check-cfg = ["cfg(frb_expand)"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
