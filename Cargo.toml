[package]
name = "lora-mqtt-hub-firmware"
version = "0.1.0"
edition = "2021"

# Only build the binary for embedded target
[[bin]]
name = "lora-mqtt-hub-firmware"
path = "src/main.rs"
required-features = ["embedded"]

[dependencies]
# ESP HAL and RTOS (only for embedded target)
esp-hal = { version = "1.0", features = ["esp32s3", "unstable"], optional = true }
esp-rtos = { version = "0.2", features = ["esp32s3", "embassy", "esp-radio"], optional = true }
esp-bootloader-esp-idf = { version = "0.4", default-features = false, features = ["esp32s3"], optional = true }
esp-backtrace = { version = "0.18", features = ["esp32s3", "panic-handler", "println"], optional = true }
esp-println = { version = "0.16", default-features = false, features = ["esp32s3", "jtag-serial"], optional = true }

# Embassy async runtime (versions must match esp-rtos dependencies)
embassy-executor = { version = "0.9", optional = true }
embassy-sync = { version = "0.7", optional = true }
embassy-time = { version = "0.5", optional = true }

# Embedded HAL traits (only for embedded target)
embedded-hal = { version = "1.0", optional = true }
embedded-hal-async = { version = "1.0", optional = true }
embedded-io = { version = "0.6", optional = true }
embedded-io-async = { version = "0.6", optional = true }

# Static allocation (only for embedded target)
static_cell = { version = "2.1", optional = true }

# WiFi support via esp-radio
esp-radio = { version = "0.17", features = ["esp32s3", "wifi", "unstable"], optional = true }
esp-alloc = { version = "0.9", optional = true }

# Async utilities (select over radio/channel futures)
embassy-futures = { version = "0.1", optional = true }

# USB OTG support for dual CDC-ACM
embassy-usb = { version = "0.5", default-features = false, features = ["max-interface-count-4", "max-handler-count-4"], optional = true }

# Shared wire protocol (COBS framing, CRC, command/response codec), as a submodule
wt-protocol = { path = "vendor/wt-protocol", default-features = false }

# Data structures
heapless = "0.8"

# Critical-section implementation for host-side driver tests (host-test feature)
critical-section = { version = "1", optional = true }

# Hub provisioning/status protocol (in-repo, layered on wt-protocol framing)
hub-protocol = { version = "0.1.0", path = "hub-protocol", features = ["serde"] }

# Config persistence: serde structs stored via postcard in the nvs flash
# partition through sequential-storage. esp-storage 0.8 matches esp-hal 1.0;
# embassy-embedded-hal 0.5 matches embassy-sync 0.7.
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
postcard = { version = "1.1.3", default-features = false }
esp-storage = { version = "0.8.1", features = ["esp32s3"], optional = true }
sequential-storage = { version = "8.0.1", optional = true, features = ["postcard"] }
embassy-embedded-hal = { version = "0.5.0", default-features = false, optional = true }
embedded-storage = { version = "0.3.1", optional = true }
embedded-storage-async = { version = "0.4.1", optional = true }
embassy-net = { version = "0.8.0", features = ["tcp", "udp", "dhcpv4", "dns", "medium-ethernet", "proto-ipv4"], optional = true }
rust-mqtt = { version = "0.5.1", default-features = false, optional = true, features = ["alloc", "v5"] }
serde-json-core = "0.6.0"
base64 = { version = "0.23.1", default-features = false }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }

[profile.release]
opt-level = "s"
lto = true

[profile.dev]
opt-level = 1

[features]
default = []
# Host-side testing of the LoRa driver without the esp-hal toolchain.
# Pulls in embassy-time's mock time driver plus the embedded-hal traits so the
# driver can be driven by a recording SPI/pin mock on the host target.
host-test = [
    "dep:embassy-time",
    "embassy-time/mock-driver",
    "embassy-time/generic-queue-8",
    "dep:embedded-hal",
    "dep:embedded-hal-async",
    "dep:critical-section",
    "critical-section/std",
]
# Enable this for embedded builds
embedded = [
    "esp-hal",
    "esp-rtos",
    "esp-bootloader-esp-idf",
    "esp-backtrace",
    "esp-println",
    "embassy-executor",
    "embassy-sync",
    "dep:embassy-time",
    "dep:embedded-hal",
    "dep:embedded-hal-async",
    "embedded-io",
    "embedded-io-async",
    "static_cell",
    "esp-radio",
    "esp-alloc",
    "embassy-futures",
    "embassy-usb",
    "dep:esp-storage",
    "dep:sequential-storage",
    "dep:embassy-embedded-hal",
    "dep:embedded-storage",
    "dep:embedded-storage-async",
    "dep:embassy-net",
    "dep:rust-mqtt",
]
